[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reconocimiento-facial"
version = "0.2.0"
description = "Facial recognition system"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=46",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "torch>=2.2",
    "torchvision>=0.17",
    "timm>=1.0,<2",
    "gdown>=5.2,<6",
]

[project.optional-dependencies]
calibration = ["matplotlib"]

[project.scripts]
reconocimiento-facial = "reconocimiento_facial.cli:main"

[tool.setuptools]
packages = ["reconocimiento_facial"]
